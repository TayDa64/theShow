name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: '! grep -R "GEMINI_API_KEY" dist/assets'

  test:
    runs-on: ubuntu-latest
    env:
      GROK_AUTH_FILE: /nonexistent/theshow-test-auth.json
      THESHOW_FORBID_HOME_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: refuse paid credentials and a home auth store
        run: |
          test -z "${XAI_API_KEY:-}"
          test -z "${GROK_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test ! -e "$HOME/.grok/auth.json"
      - run: npm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mcp
      - run: git diff --exit-code -- mcp/server.bundle.mjs

  all-green:
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - build
      - test
      - bundle
    steps:
      - run: echo 'All required jobs passed.'
