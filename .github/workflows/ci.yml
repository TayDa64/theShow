name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: '! grep -R "GEMINI_API_KEY" dist/assets'

  test:
    runs-on: ubuntu-latest
    env:
      GROK_AUTH_FILE: /nonexistent/theshow-test-auth.json
      THESHOW_FORBID_HOME_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: refuse paid credentials and a home auth store
        run: |
          test -z "${XAI_API_KEY:-}"
          test -z "${GROK_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test ! -e "$HOME/.grok/auth.json"
      - run: npm test

  test-ffmpeg7:
    runs-on: ubuntu-latest
    env:
      GROK_AUTH_FILE: /nonexistent/theshow-test-auth.json
      THESHOW_FORBID_HOME_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install ffmpeg 7.1
        run: |
          # Pinned autobuild. sha256sum -c fails the job when the archive changes.
          url=https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
          curl -fsSL -o /tmp/ffmpeg71.tar.xz "$url"
          echo "c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79  /tmp/ffmpeg71.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ffmpeg71-src
          tar -xJf /tmp/ffmpeg71.tar.xz -C /tmp/ffmpeg71-src --strip-components=1
          /tmp/ffmpeg71-src/bin/ffmpeg -version | head -1
      - name: refuse paid credentials and a home auth store
        run: |
          test -z "${XAI_API_KEY:-}"
          test -z "${GROK_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test ! -e "$HOME/.grok/auth.json"
      - name: test on ffmpeg 7.1
        env:
          FFMPEG_PATH: /tmp/ffmpeg71-src/bin/ffmpeg
          FFPROBE_PATH: /tmp/ffmpeg71-src/bin/ffprobe
        run: |
          export PATH="/tmp/ffmpeg71-src/bin:$PATH"
          ffmpeg -version | head -1
          npm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mcp
      - run: git diff --exit-code -- mcp/server.bundle.mjs mcp/server-http.bundle.mjs

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GROK_AUTH_FILE: /nonexistent/theshow-test-auth.json
      THESHOW_FORBID_HOME_AUTH: "1"
      THESHOW_VIDEO_BACKEND: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: refuse paid credentials, a home auth store, and a live Veo run
        run: |
          test -z "${XAI_API_KEY:-}"
          test -z "${GROK_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${RUN_LIVE_VEO:-}"
          test ! -e "$HOME/.grok/auth.json"
          test "${THESHOW_VIDEO_BACKEND}" = "sandbox"
          grep -q "const SANDBOX_BACKEND = 'sandbox'" playwright.config.ts
          grep -q 'THESHOW_VIDEO_BACKEND: SANDBOX_BACKEND' playwright.config.ts
          grep -q 'HOME: STUDIO_HOME' playwright.config.ts
          grep -q 'THESHOW_JOBS_DIR: STUDIO_JOBS' playwright.config.ts
          grep -q 'THESHOW_OUTPUT_DIR:' playwright.config.ts
          grep -q 'THESHOW_CHARACTERS_DIR:' playwright.config.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  all-green:
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - build
      - test
      - test-ffmpeg7
      - bundle
      - e2e
    steps:
      - run: echo 'All required jobs passed.'
